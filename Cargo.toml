[package]
name = "govinda-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
dotenvy = "0.15"
futures-util = "0.3"
reedline = "0.50.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
termimad = "0.35.2"
tiktoken-rs = { version = "0.12.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
zeroize = "1.9.0"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
rust_2018_idioms = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
